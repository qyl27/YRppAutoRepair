name: 'Build Artifacts'

inputs:
  sln-path:
    description: 'Path to the solution file relative to the root of the project'
    required: false
    default: '.'
  build-config:
    description: 'Configuration to build'
    required: true
  version-tag:
    description: 'Version tag appended to output file names'
    required: false
    default: ${{ github.sha }}

runs:
  using: "composite"
  steps:
  - name: Add MSBuild to PATH
    uses: microsoft/setup-msbuild@v3
    with:
      vs-version: '[16.0, )'

  - uses: ammaraskar/msvc-problem-matcher@541aa4360062d76d9620af6b8bd35cfa0c5ef19f

  - name: Build
    working-directory: ${{ env.GITHUB_WORKSPACE }}
    run: msbuild /m /p:Configuration=${{ inputs.build-config }} /p:TargetName=YRAutoRepair-${{ inputs.version-tag }} ${{ inputs.sln-path }}
    shell: cmd

  - name: Upload Artifacts
    if: ${{ success() }}
    uses: actions/upload-artifact@v7
    with:
      name: artifacts
      path: |
        ${{ inputs.sln-path }}/${{ inputs.build-config }}/YRAutoRepair-${{ inputs.version-tag }}.dll
        ${{ inputs.sln-path }}/${{ inputs.build-config }}/YRAutoRepair-${{ inputs.version-tag }}.pdb
